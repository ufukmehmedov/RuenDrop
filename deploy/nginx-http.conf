# Standalone bootstrap only when this domain has no existing virtual host.
server {
    listen 80;
    listen [::]:80;
    server_name photos.example.com;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://photos.example.com$request_uri; }
}
