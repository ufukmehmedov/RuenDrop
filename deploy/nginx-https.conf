# Standalone template only when there is no existing HTTPS virtual host.
# Replace example.com paths with certificate paths after successful issuance.
limit_req_zone $binary_remote_addr zone=ruendrop_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ruendrop_connections:1m;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name photos.example.com;
    ssl_certificate /etc/letsencrypt/live/photos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_req zone=ruendrop_requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn ruendrop_connections 8;
    include /etc/nginx/snippets/ruendrop.conf;
    location / { return 404; }
}
