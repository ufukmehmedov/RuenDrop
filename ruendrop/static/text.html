<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>RuenText</title><link rel="stylesheet" href="/text/assets/text.css"><script type="module" src="/text/assets/text.js"></script></head><body><main><h1>RuenText</h1><p>Your text is encrypted in this browser. Share the complete link privately.</p><label for="message">Your text</label><textarea id="message" spellcheck="true" placeholder="Write or paste your message…"></textarea><label for="mode">Link lifetime</label><select id="mode"><option value="24h">24 hours</option><option value="burn">Burn after reading</option></select><p>Burn links also expire after 24 hours if unread. Up to 1 MiB encrypted content.</p><button id="create">Create secure link</button><section id="result" hidden><label for="share">Private share link</label><input id="share" readonly><button id="copy">Copy link</button></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
